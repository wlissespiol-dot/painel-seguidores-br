<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Seguidores BR</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: white;
}

header {
    background: #151515;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #d4af37;
}

header h1 {
    margin: 0;
    color: #d4af37;
}

header p {
    color: #aaa;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: #151515;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #292929;
}

.card h3 {
    color: #aaa;
    margin-top: 0;
}

.card strong {
    font-size: 28px;
    color: #d4af37;
}

.box {
    background: #151515;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    border: 1px solid #292929;
}

h2 {
    color: #d4af37;
}

input, select, button {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border-radius: 8px;
    border: none;
    font-size: 15px;
}

input, select {
    background: #242424;
    color: white;
}

#valor {
    background: #181818;
    color: #d4af37;
    font-weight: bold;
}

button {
    background: #d4af37;
    color: #000;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #f0c94b;
}

.pedido {
    background: #202020;
    padding: 15px;
    margin-top: 10px;
    border-radius: 8px;
}

.pedido span {
    color: #d4af37;
}

.whatsapp {
    background: #25D366;
    color: white;
}

.excluir {
    background: #a83232;
    color: white;
}
</style>
</head>

<body>

<header>
<h1>👑 PAINEL SEGUIDORES BR</h1>
<p>Gerenciamento de pedidos</p>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Pedidos</h3>
<strong id="total">0</strong>
</div>

<div class="card">
<h3>Pendentes</h3>
<strong id="pendentes">0</strong>
</div>

<div class="card">
<h3>Concluídos</h3>
<strong id="concluidos">0</strong>
</div>

</div>

<div class="box">

<h2>➕ Novo Pedido</h2>

<input id="cliente" placeholder="Nome do cliente">

<input id="instagram" placeholder="Link do Instagram">

<select id="servico" onchange="calcularValor()">
<option value="Seguidores Brasileiros">Seguidores Brasileiros</option>
<option value="Curtidas">Curtidas</option>
</select>

<input
id="quantidade"
type="number"
placeholder="Quantidade"
oninput="calcularValor()"
>

<input
id="valor"
type="text"
placeholder="Valor R$"
readonly
>

<select id="status">
<option
